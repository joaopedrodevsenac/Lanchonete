<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>JP Lanchonete</title>
		<link rel="stylesheet" href="reset.css">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<div class="caixa">
				<h1><img src="logo.png"></h1>
				<nav>
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="cardapio.html">Cardápio</a></li>
						<li><a href="contato.html">Contato</a></li>
					</ul>
				</nav>  
			</div>
		</header>

        <main>
            <form>
                <label for="nomesobrenome">Nome e Sobrenome</label>
                <input type="text" id="nomesobrenome" class="input-padrao" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com">

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" class="input-padrao" required placeholder="(XX) XXXXX-XXXX">

                <label for="mensagem">Pedido ou Mensagem</label>
                <input cols="70" rows="10" class="mensagem" class="input-padrao" required>

                <fieldset>
                    <legend>Como prefere o nosso contato?</legend>
                    <label for="radio-email"><input type="radio" name="contato" value="email" id="radio-email">Email</label>
                    <label for="radio-telefone"><input type="radio" name="contato" value="telefone" id="radio-telefone">Telefone</label>
                    <label for="radio-whatsapp"><input type="radio" name="contato" value="whatsapp" id="radio-whatsapp" checked>Whatsapp</label>
                </fieldset>

                <fieldset>
                    <legend>Qual horário prefere receber seu pedido?</legend>
                    <select>
                        <option>18 horas</option>
                        <option>19 horas</option>
                        <option>20 horas</option>
                        <option>21 horas</option>
                        <option>22 horas(Somente de Segunda a Sábado)</option>
                    </select>
                </fieldset>

                <label><input type="checkbox" class="checkbox" checked="">Gostaria de receber nossas promoções por e-mail?</label>

                <input type="submit" value="Enviar Pedido" class="enviar">
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Horário</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Segunda</td>
                        <td>18h - 23h</td>
                    </tr>
                    <tr>
                        <td>Quarta</td>
                        <td>18h - 23h</td>
                    </tr>
                    <tr>
                        <td>Sexta</td>
                        <td>18h - 00h</td>
                    </tr>
                    <tr>
                        <td>Sábado</td>
                        <td>18h - 00h</td>
                    </tr>
                    <tr>
                        <td>Domingos e Feriados</td>
                        <td>18h - 21h</td>
                    </tr>
                </tbody>
            </table>

            <br>
            <p>Fazemos entregas somente nas Sextas e Sábados!</p>
        </main>

        <footer>
			<img src="logo.png">
			<p class="copyright">&copy; Copyright JP Lanchonete- 2026</p>
		</footer>
    </body>
</html>
